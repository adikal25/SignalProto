crawl:
  paths: ["/", "/test.html", "/careers", "/jobs", "/locations", "/news", "/press", "/blog", "/about"]
  max_pages: 8
  timeout_seconds: 15

# confidence threshold for triggering the outbound agent
gate:
  min_confidence: 0.6

# freshness decay: how scores are weighed as signals age
freshness:
  weekly_decay: 0.65 # focusing more on recency
  floor: 0.3

# Models per agent. provider: ollama (local, default) or bring-your-own-key:
#   anthropic (ANTHROPIC_API_KEY) | openai (OPENAI_API_KEY) | groq (GROQ_API_KEY)
#   openrouter (OPENROUTER_API_KEY) | gemini (GEMINI_API_KEY)
#   openai_compatible (base_url + LLM_API_KEY, or name your own variable with api_key_env)
# Keys are read from the environment only; never put them in this file.
llm:
  signal:
    provider: ollama
    model_id: llama3.2:3b
    max_new_tokens: 200
    temperature: 0.0
  outbound:
    provider: ollama
    model_id: llama3.2:3b
    max_new_tokens: 400
    temperature: 0.3
  # Example: keep the high-volume signal checks local, write emails with your own Claude key:
  # outbound:
  #   provider: anthropic
  #   model_id: claude-opus-5-5
  #   max_new_tokens: 4096     # Claude reasons before answering; leave room
  #   effort: low              # low | medium | high | xhigh | max
  # Example: a self-hosted vLLM / LM Studio server:
  # signal:
  #   provider: openai_compatible
  #   base_url: http://gpu-box:8000/v1
  #   model_id: <served model name>
  #   api_key_env: VLLM_API_KEY

signals:
  max_candidates_per_domain: 12

sender:
  name: Alex
  company: Acme
  value_prop: helps growing teams turn new demand into booked appointments

# provider: none | link | calcom   (calcom reads CALCOM_API_KEY from env)
booking:
  provider: none
  link_url: null
  calcom_event_type_id: null
  timezone: America/New_York
  slots_to_offer: 3
  lookahead_days: 7

# provider: none | csv | webhook | hubspot   (hubspot reads HUBSPOT_TOKEN from env)
crm:
  provider: none
  csv_accounts_path: data/companies.sample.csv
  csv_output_path: data/crm_records.jsonl
  webhook_url: null

storage:
  db_path: data/signalproto.db

# new signals found by `watch` are POSTed here (e.g. a Slack incoming webhook)
alerts:
  webhook_url: null

# Account scoring: FIT (who they are) x INTENT (what they're doing now) -> grade A1..D4 -> tier.
scoring:
  icp:
    size_bands:                  # employees -> fit points
      - {min: 1, max: 4, points: 10}
      - {min: 5, max: 49, points: 60}
      - {min: 50, max: 200, points: 45}
      - {min: 201, max: 1000, points: 15}
    unknown_size_points: 30
    disqualify_above: 5000       # enterprise: not our buyer
    verticals: [dental, veterinary, fitness, medical, salon]
    excluded_verticals: []
    vertical_points: 40
  signal_types:
    expansion: {base_value: 0.75, half_life_days: 60}
    hiring: {base_value: 0.6, half_life_days: 30}
  # we sell scheduling: front-office hiring and new locations matter most
  relevant_keywords:
    hiring: [front desk, receptionist, coordinator, office manager, patient, scheduler, hygienist, technician, trainer]
  irrelevant_multiplier: 0.6
  surge_window_days: 30
  surge_bonus: 0.25
  contact_cooldown_days: 21
  cooldown_penalty: 0.5
