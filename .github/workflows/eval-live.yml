name: eval-live

# Runs the eval against a real local model: nightly, on demand, and whenever prompts or the eval set change.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/signals/**", "src/schemas.py", "eval/**"]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-llama3.2-3b
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true   # run our own server so models land in the cached ~/.ollama
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:11434/api/tags && break; sleep 1; done
          ollama pull llama3.2:3b
      # CPU inference can differ slightly from the recording machine; --tolerance absorbs that.
      - name: Live eval gate
        run: python -m eval.run_eval --model llama3.2:3b --gate --tolerance 0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
